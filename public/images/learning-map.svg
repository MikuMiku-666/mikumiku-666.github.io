<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><rect width="900" height="420" rx="12" fill="#f1f0e8"/><circle cx="760" cy="77" r="95" fill="#ece0e3"/><circle cx="100" cy="390" r="105" fill="#e4eadb"/><text x="50" y="57" fill="#7c8574" font-family="sans-serif" font-size="12" letter-spacing="3">A SMALL LOOP OF LEARNING</text><text x="50" y="101" fill="#3c5037" font-family="Georgia,serif" font-size="32">Make room for a new idea.</text><path d="M240 234h70m210 0h70" fill="none" stroke="#99a78a" stroke-width="2" stroke-dasharray="5 5"/><path d="m302 228 8 6-8 6m280-12 8 6-8 6" fill="none" stroke="#99a78a" stroke-width="2"/><g transform="translate(50 170)"><rect width="190" height="137" rx="10" fill="#e0e8d7" stroke="#cdd7c1"/><text x="20" y="35" fill="#7e8f70" font-size="12" font-family="monospace">01 / CAPTURE</text><text x="20" y="75" fill="#425639" font-size="23" font-family="Georgia,serif">Stay curious.</text><path d="M20 101h110m-110 9h80" stroke="#bac8ad" stroke-width="3"/></g><g transform="translate(310 170)"><rect width="210" height="137" rx="10" fill="#eddee2" stroke="#dec8cf"/><text x="20" y="35" fill="#a17a85" font-size="12" font-family="monospace">02 / UNDERSTAND</text><text x="20" y="75" fill="#855f6a" font-size="23" font-family="Georgia,serif">Write it down.</text><path d="M20 101h110m-110 9h80" stroke="#d6b9c3" stroke-width="3"/></g><g transform="translate(590 170)"><rect width="250" height="137" rx="10" fill="#e1e8ef" stroke="#cad6e2"/><text x="20" y="35" fill="#7f96ae" font-size="12" font-family="monospace">03 / MAKE SOMETHING</text><text x="20" y="75" fill="#5e7994" font-size="23" font-family="Georgia,serif">Try, then share.</text><path d="M20 101h110m-110 9h80" stroke="#b6c8d8" stroke-width="3"/></g><text x="50" y="371" fill="#8a9082" font-size="11" font-family="monospace" letter-spacing="1">SMALL STEPS. NEW POSSIBILITIES. REPEAT.</text></svg>
